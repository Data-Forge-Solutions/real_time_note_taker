name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/CI.yml

  release:
    name: Build & Release Cross-Platform
    needs: test
    if: startswith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install target
        if: matrix.os != 'ubuntu-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Build Linux binary in project container
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker build --target builder --tag rtnt-builder:${{ github.sha }} --file Containerfile .
          container_id=$(docker create rtnt-builder:${{ github.sha }})
          trap 'docker rm --force "$container_id"' EXIT
          mkdir -p target/${{ matrix.target }}/release
          docker cp "$container_id:/usr/src/rtnt/target/release/rtnt" target/${{ matrix.target }}/release/rtnt
          docker rm "$container_id"
          trap - EXIT

      - name: Build binary on native runner
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Rename and zip binary
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rtnt${{ matrix.ext }} dist/rtnt-${{ matrix.target }}${{ matrix.ext }}
        # Only run zip if not Windows
      - name: Zip binary (non-Windows)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist
          zip rtnt-${{ matrix.target }}.zip rtnt-${{ matrix.target }}${{ matrix.ext }}

      - name: Zip binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/rtnt-${{ matrix.target }}.exe -DestinationPath dist/rtnt-${{ matrix.target }}.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          files: dist/*.zip

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build publishing environment
        run: docker build --target development --tag rtnt-publish:${{ github.sha }} --file Containerfile .
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          docker run --rm \
            --env CARGO_REGISTRY_TOKEN \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            rtnt-publish:${{ github.sha }} \
            cargo publish --locked
